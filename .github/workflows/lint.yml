name: Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3

  markdown:
    name: markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rumdl
        run: |
          python3 -m venv tmp/rumdl-venv
          tmp/rumdl-venv/bin/python -m pip install 'rumdl==0.2.36'
          echo "$GITHUB_WORKSPACE/tmp/rumdl-venv/bin" >> "$GITHUB_PATH"
      - name: Lint Markdown
        run: |
          test "$(rumdl --version)" = "rumdl 0.2.36"
          make go/lint-docs
          test ! -d .rumdl_cache
